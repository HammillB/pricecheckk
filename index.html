<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Check</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 6px 0;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px 0;
  }
  .search-row {
    display: flex;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto 12px auto;
  }
  #query {
    flex: 1;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  #query:focus {
    border-color: #999;
  }
  #searchBtn {
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    background: #1a1a1a;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #searchBtn:hover { background: #333; }

  .open-all-row {
    text-align: center;
    margin-bottom: 32px;
    min-height: 20px;
  }
  #openAllBtn {
    display: none;
    background: none;
    border: none;
    color: #2e7d32;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .card.ready { opacity: 1; }
  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .site-name {
    font-weight: 700;
    font-size: 15px;
  }
  .card-query {
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .open-btn {
    margin-top: auto;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafafa;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: var(--text);
    text-decoration: none;
    display: block;
  }
  .open-btn:hover {
    background: #f0f0f0;
  }
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Price Check</h1>
    <p class="subtitle">Search once, compare across 5 stores</p>

    <div class="search-row">
      <input type="text" id="query" placeholder="What are you looking for?" autofocus>
      <button id="searchBtn">Search</button>
    </div>
    <div class="open-all-row">
      <button id="openAllBtn">Open all 5 in new tabs</button>
    </div>

    <div class="cards" id="cards"></div>

    <p class="footer">Opens each store's own search results in a new tab. Nothing is scraped or stored except your last search, saved locally in this browser.</p>
  </div>

<script>
const SITES = [
  { key: "amazon", label: "Amazon", color: "#ff9900", search: q => `https://www.amazon.com/s?k=${encodeURIComponent(q)}` },
  { key: "ebay", label: "eBay", color: "#e53238", search: q => `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(q)}` },
  { key: "walmart", label: "Walmart", color: "#0071ce", search: q => `https://www.walmart.com/search?q=${encodeURIComponent(q)}` },
  { key: "target", label: "Target", color: "#cc0000", search: q => `https://www.target.com/s?searchTerm=${encodeURIComponent(q)}` },
  { key: "fredmeyer", label: "Fred Meyer", color: "#00563f", search: q => `https://www.fredmeyer.com/search?query=${encodeURIComponent(q)}` }
];

const cardsEl = document.getElementById("cards");
const queryEl = document.getElementById("query");
const searchBtn = document.getElementById("searchBtn");
const openAllBtn = document.getElementById("openAllBtn");

let currentQuery = "";

function render() {
  cardsEl.innerHTML = "";
  SITES.forEach(site => {
    const card = document.createElement("div");
    card.className = "card" + (currentQuery ? " ready" : "");

    const top = document.createElement("div");
    top.className = "card-top";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = site.color;
    const name = document.createElement("span");
    name.className = "site-name";
    name.textContent = site.label;
    top.appendChild(dot);
    top.appendChild(name);

    const q = document.createElement("div");
    q.className = "card-query";
    q.textContent = currentQuery ? `"${currentQuery}"` : "Waiting for search...";

    const btn = document.createElement("a");
    btn.className = "open-btn";
    btn.textContent = currentQuery ? `Open on ${site.label} →` : "—";
    if (currentQuery) {
      btn.href = site.search(currentQuery);
      btn.target = "_blank";
      btn.rel = "noopener";
    } else {
      btn.removeAttribute("href");
    }

    card.appendChild(top);
    card.appendChild(q);
    card.appendChild(btn);
    cardsEl.appendChild(card);
  });

  openAllBtn.style.display = currentQuery ? "inline-block" : "none";
}

function doSearch() {
  const q = queryEl.value.trim();
  if (!q) return;
  currentQuery = q;
  localStorage.setItem("priceCheckLastQuery", q);
  render();
}

searchBtn.addEventListener("click", doSearch);
queryEl.addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

openAllBtn.addEventListener("click", () => {
  if (!currentQuery) return;
  SITES.forEach(site => window.open(site.search(currentQuery), "_blank"));
});

// Restore last search on load
const saved = localStorage.getItem("priceCheckLastQuery");
if (saved) {
  queryEl.value = saved;
  currentQuery = saved;
}
render();
</script>
</body>
</html>
